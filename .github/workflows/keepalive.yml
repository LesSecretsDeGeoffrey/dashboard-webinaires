# Réveil quotidien de Supabase (free tier = pause après ~7 jours sans requête).
# Une simple lecture par jour suffit à garder le projet actif → le dashboard
# et le webhook ventes ne tombent jamais sur une base endormie.
# (La clé ci-dessous est la clé publique déjà embarquée dans la page — rien de secret.)
name: Keepalive Supabase

on:
  schedule:
    - cron: '17 6 * * *' # tous les jours à 06h17 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (lecture 1 ligne)
        run: |
          curl -sf "https://mxnrqnpvcxwdwykzzchk.supabase.co/rest/v1/webinaires?select=id&limit=1" \
            -H "apikey: sb_publishable_f_MKNNQu-CG7LqW3Bs0sUA_TIU2fBUf" \
            -H "Authorization: Bearer sb_publishable_f_MKNNQu-CG7LqW3Bs0sUA_TIU2fBUf" \
            -o /dev/null
