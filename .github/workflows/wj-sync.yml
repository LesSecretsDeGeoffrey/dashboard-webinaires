# Sync automatique WebinarJam -> dashboard (table webinaires Supabase).
# 4x/jour : inscrits en continu pendant la semaine d'acquisition,
# présence + taux de visionnage remplis automatiquement après le live.
# Le run de 20h05 UTC le dimanche = juste après la fin du live (~21h45 Paris).
# Clé WJ = secret du repo (WJ_API_KEY) — jamais en clair dans le code.
name: Sync WebinarJam

on:
  schedule:
    - cron: '0 5,11,17 * * *'   # 3x/jour (UTC)
    - cron: '5 20 * * *'        # + tous les soirs 20h05 UTC (22h05 Paris, post-live le dimanche)
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync WJ -> Supabase
        env:
          WJ_API_KEY: ${{ secrets.WJ_API_KEY }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          SYSTEME_API_KEY: ${{ secrets.SYSTEME_API_KEY }}
        run: python3 auto-sync/wj_auto_sync.py
