# Attribution des ventes : depenses Meta par pub/jour + copie des contacts
# Systeme.io + attribution de chaque vente a sa pub/son canal + (phase 3)
# Purchase CAPI vers Meta. Ne tourne qu'apres le PUSH du depot (committe ne suffit pas).
name: Attribution ventes

concurrency:
  group: attribution
  cancel-in-progress: false   # un run manuel qui chevauche le cron attend son tour (jamais deux envois Purchase en parallele)

on:
  schedule:
    - cron: '30 2,8,14,20 * * *'   # toutes les 6 h (UTC), decale des syncs existants
  workflow_dispatch:
    inputs:
      recalc:
        description: "Recalculer TOUTES les attributions depuis touches/contacts_sio (--recalc)"
        type: boolean
        default: false
      capi_test_code:
        description: "Purchase CAPI vers l'outil Evenements de test (code TESTxxxxx du Gestionnaire d'evenements) : n'envoie RIEN pour de vrai"
        type: string
        default: ""
      capi_go:
        description: "Purchase CAPI REEL maintenant (--capi), sans attendre le cron"
        type: boolean
        default: false
      capi_retry:
        description: "Rejouer les envois reels en erreur (--capi-retry), avec capi_go"
        type: boolean
        default: false

jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Depenses + contacts + attribution (+ Purchase CAPI) -> Supabase
        env:
          SYSTEME_API_KEY: ${{ secrets.SYSTEME_API_KEY }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CAPI_TEST_CODE: ${{ inputs.capi_test_code }}
        run: >
          python3 auto-sync/attribution_sync.py
          ${{ inputs.recalc == true && '--recalc' || '' }}
          ${{ inputs.capi_test_code != '' && '--capi-test "$CAPI_TEST_CODE" --capi-forcer --seulement-capi' || '' }}
          ${{ inputs.capi_go == true && '--capi' || '' }}
          ${{ inputs.capi_retry == true && '--capi-retry' || '' }}
